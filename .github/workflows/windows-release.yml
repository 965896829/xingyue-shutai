name: Windows x64 release verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - name: Offline regression tests (no model credentials)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .test-output
          npm test | tee .test-output/desktop-regression.log
      - name: Build and package Windows
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm exec -- electron-builder --config scripts/windows-builder.cjs --win nsis --x64 --publish never
      - name: Open packaged workspace and studio with an isolated profile
        run: node scripts/smoke-desktop.mjs
      - name: Verify the installer, runtime and bundled resources
        run: node scripts/check-deliverables.mjs .test-output/desktop-regression.log
      - name: Retain platform packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-development-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
