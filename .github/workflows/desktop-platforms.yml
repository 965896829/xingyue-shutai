name: macOS development and desktop delivery

on:
  push:
    branches: [main, 'codex/macos-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_windows:
        description: Include Windows x64 release verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.verify_windows && '["macos-26","macos-15-intel","windows-2022"]' || '["macos-26","macos-15-intel"]') }}
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - name: Offline regression tests (no model credentials)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .test-output
          npm test | tee .test-output/desktop-regression.log
      - name: Build and package Windows
        if: runner.os == 'Windows'
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm exec -- electron-builder --win nsis --x64 --publish never
      - name: Build ad-hoc macOS development packages
        if: runner.os == 'macOS'
        run: npm run dist
      - name: Open packaged workspace and studio with an isolated profile
        run: node scripts/smoke-desktop.mjs
      - name: Verify the installer, runtime and bundled resources
        run: node scripts/check-deliverables.mjs .test-output/desktop-regression.log
      - name: Retain platform packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-development-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*-mac-*.dmg
            release/*-mac-*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
